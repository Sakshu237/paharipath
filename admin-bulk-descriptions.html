<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PahariPath — Bulk Description Upload</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3d2b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7c6e; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(74,124,95,.15);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status.warn { background: #fdf3e3; color: #9b6c1a; }
  .status.ok { background: #e6f4ec; color: #1a6b3c; }
  .status.err { background: #fdeaea; color: #9b2020; }
  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Description Upload</h1>
  <div class="sub">Pushes long-form descriptions into your live Supabase data, using your own admin login. No API keys needed here.</div>

  <div id="statusBox" class="status warn">Checking your login session…</div>

  <div class="card">
    <div id="destList"></div>
    <div class="count" id="countLine"></div>
  </div>

  <button id="runBtn" onclick="runAll()" disabled>Checking login…</button>
</div>

<script>
const SUPABASE_URL = "https://fcrkfemeirmfhhxhomgw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcmtmZW1laXJtZmhoeGhvbWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDE0NjksImV4cCI6MjA5NzM3NzQ2OX0.6OH8shrt0js3E-uh_GHxm2NFASygzTmKeMaNYobclM4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DESTINATIONS = [{"id": 40, "name": "Hikkim", "desc": "Hikkim holds a genuinely singular title: the world's highest post office, sitting at 4,440m in Spiti's high plateau. It still functions as a real post office, not a museum piece — sending a postcard from here, hand-stamped with the location, is one of the more memorable small rituals a traveler can do in Himachal. Best time is June–September. It's typically combined with nearby Komic and Langza as a trio of high-altitude Spiti villages, but Hikkim's postal history gives it a specific, easy-to-explain hook that the others don't have — worth the stop even on a tight Spiti loop."}, {"id": 55, "name": "Bharmour", "desc": "Bharmour anchors a genuinely distinctive corner of Chamba district: home to the Gaddi community, a semi-nomadic pastoral tribe, and site of the Chaurasi temple complex — 84 shrines clustered together, some dating back over a thousand years. At 2,195m, it also serves as the main base for the demanding Manimahesh Lake pilgrimage trek. Best time is June–September. Bharmour rewards travelers with a genuine interest in both architecture and living tribal culture; the Gaddi presence here isn't staged for tourism, it's simply how the town has functioned for generations."}, {"id": 61, "name": "Pong Dam Wetlands", "desc": "Pong Dam Wetlands is a Ramsar-recognized wetland in Kangra district that transforms every winter into a major bird-watching destination — over 220 recorded migratory species pass through, with bar-headed geese arriving in striking numbers between November and February. At 430m, it's low-altitude and easy to access, with that November–February window being essential; visiting outside it means missing the birds almost entirely. It's one of the few genuinely world-class wildlife spectacles in Himachal that most travelers never hear about, let alone plan a trip around."}, {"id": 64, "name": "Sar Pass", "desc": "Sar Pass is a classic five-day snowfield trek reaching 4,250m, popular specifically for the extended stretches of snow travelers cross even in late spring — a rarer feature on treks of this accessibility level. Best time is May–June, when the snowfields are at their most striking without being dangerously unstable. It's considered a solid intermediate trek: demanding enough to feel like a real accomplishment, but without the technical glacier travel of routes like Pin Parvati Pass. A well-established choice for trekkers building toward more serious high-altitude routes."}, {"id": 109, "name": "Keylong", "desc": "Keylong serves as the administrative headquarters of Lahaul district, but it functions as a genuine working town rather than a purpose-built tourist base — something increasingly rare along the Manali–Leh corridor. At 3,100m, the Shashur monastery sits on a rise just above town, worth the short climb for its setting alone. Best time is June–September. For travelers passing through en route to Spiti or Leh, Keylong is a chance to experience real Lahauli community life rather than another roadside stopover built purely around passing traffic."}, {"id": 122, "name": "Katrain", "desc": "Katrain sits in a quiet, easily overlooked stretch of Kullu Valley, its apple orchards and Beas riverside setting largely bypassed by travelers speeding between Manali and Kullu town. At 1,463m, it's accessible year-round with a best-time window of March–June or September–November. There's no headline attraction here — the value is simply a slower, quieter version of the Kullu Valley experience most travelers rush through, worth a deliberate stop for anyone willing to trade a destination checkbox for unhurried orchard scenery."}, {"id": 127, "name": "Mashobra", "desc": "Mashobra sits close enough to Shimla for an easy outing, but keeps a village character that Shimla's Mall Road lost long ago. At 2,149m, the Craignano picnic spot and surrounding apple orchards give it a genuinely quiet, green feel, with a best-time window of March–June or September–October. It works well as either a calmer alternative to staying in Shimla itself, or a half-day escape for travelers based there who want orchard walks and quiet without leaving the district."}, {"id": 131, "name": "Nadaun", "desc": "Nadaun sits on the Beas river in Hamirpur district, historically significant as the site of the palace of Raja Sansar Chand, a notable 18th-century Kangra ruler, alongside a peaceful riverfront and an active gurudwara. At 400m, it's low-altitude and accessible year-round, with October–March bringing the most comfortable weather. It's a town most travelers pass without stopping, but the palace ruins and riverside setting reward a deliberate visit for anyone interested in Himachal's pre-colonial regional history rather than its more commonly documented hill-station past."}, {"id": 140, "name": "Sundernagar", "desc": "Sundernagar centers on Sukh Sagar, a lake created by nearby dam infrastructure, with the Pandoh Dam viewpoint a worthwhile stop just outside town. At 900m in Mandi district, it's low-altitude and accessible year-round, with October–March being most comfortable. It functions more as a practical waypoint on the route toward Mandi or Kullu than a standalone destination, but the lake and dam views justify pausing rather than driving straight through — a stop most travelers on this route skip entirely."}, {"id": 33, "name": "Jalori Pass", "desc": "Jalori Pass is one of the rarer high-altitude passes in Himachal that's reachable by road without a multi-day trek, sitting at 3,120m with genuinely panoramic Himalayan views right from the road itself. A trail from the top leads to Sereolesar Lake for those willing to extend the visit into a half-day walk. Best time is May–June or September–October. It offers high-altitude scenery with minimal logistics — a practical option for travelers who want the pass experience without committing to a multi-day trekking itinerary."}, {"id": 36, "name": "Tirthan Valley", "desc": "Tirthan Valley functions as the main gateway to the Great Himalayan National Park, built around a genuinely crystal-clear river that draws trout anglers alongside hikers. At 1,600m, dense forest and a level of quiet that's increasingly rare in Kullu district define the valley's character. Best time is October–November or March–April. Unlike Manali or Kasol, Tirthan has deliberately stayed low-key — homestays rather than hotels, river time rather than nightlife — making it a solid fit for travelers who want nature immersion over sightseeing."}, {"id": 42, "name": "Lahaul Valley", "desc": "Lahaul Valley stretches between the Rohtang and Baralacha La passes at 3,100m, a high-altitude corridor known for wildflower blooms in season, scattered Buddhist monasteries, and the Chandrabhaga river running through it. Best time is June–September, the only real access window given the surrounding passes' snow closures. It offers a genuinely different character from Spiti just over the ridge — greener, with more visible Tibetan Buddhist cultural presence — and works well as an extended stop for travelers already crossing through en route to Spiti or Ladakh."}, {"id": 50, "name": "Kibber", "desc": "Kibber is among the highest motorable villages in the world at 4,205m, and its real claim to fame is proximity to genuine snow leopard territory — sightings, while never guaranteed, become more plausible here in winter months when leopards move to lower elevations. Best time to visit is June–September for general access, though wildlife specialists often come in winter specifically. It's a serious high-altitude destination requiring real acclimatization, best suited to travelers with a genuine interest in high-Himalayan wildlife rather than casual sightseeing."}, {"id": 60, "name": "Masrur Rock Temple", "desc": "Masrur Rock Temple is an 8th-century complex of temples carved directly from a single rock face — a technique and scale that's earned it comparisons to Maharashtra's Ellora Caves, despite receiving a fraction of the visitors. At 800m in Kangra district, it's low-altitude and accessible year-round, with October–March being most comfortable. Given its genuine architectural significance, Masrur is strikingly under-visited — a strong stop for travelers with any interest in ancient Indian rock-cut architecture who assume such sites only exist in better-marketed states."}, {"id": 69, "name": "Naldhera", "desc": "Naldhera is home to India's oldest golf course, established in 1905 by Lord Curzon, then Viceroy of India — a specific piece of colonial-era history embedded directly into the landscape. At 2,044m, the adjacent Nag temple adds a layer of local religious history alongside the golf heritage. Best time is March–June or September–October. It offers a quieter, greener alternative to central Shimla for travelers who want the same regional views without the crowd density of Mall Road."}, {"id": 76, "name": "Dainkund Peak", "desc": "Dainkund Peak is the highest point accessible from Dalhousie at 2,755m, locally nicknamed the Singing Hill for the sound wind makes moving through the surrounding forest. On a clear day, views extend across both Chamba and Kangra districts simultaneously — a genuinely wide panorama for a relatively accessible peak. Best time is March–June or September–November. It requires a short trek from the road-end rather than a drive to the summit, which keeps it quieter than Dalhousie's more accessible viewpoints."}, {"id": 108, "name": "Triloknath Temple", "desc": "Triloknath Temple holds a genuinely unusual religious distinction: it's actively worshipped by both Hindus and Buddhists simultaneously, each community recognizing the deity within their own tradition — a form of shared sacred space that's rare anywhere in the world. At 2,760m in Lahaul, the temple sees dedicated pilgrims from both faiths rather than general tourists. Best time is June–September. For travelers interested in how Himalayan religious traditions have historically coexisted rather than competed, Triloknath is a direct, tangible example."}, {"id": 130, "name": "Pong Dam", "desc": "Pong Dam in Una district functions as another access point to the same broad wetland reserve as Pong Dam Wetlands in Kangra district — a winter birding destination where bar-headed geese and hundreds of other migratory species gather. At 430m, the essential visiting window is November–February; outside those months, the wetland's defining feature simply isn't present. It's a specialist destination for birdwatchers and nature photographers rather than general sightseers, offering a scale of migratory bird activity that's genuinely unusual for the region."}, {"id": 138, "name": "Kothi", "desc": "Kothi sits on the Rohtang road at 2,500m, a small village offering Beas river views and visible glacier scenery without the crowds that build up further along the route toward Rohtang Pass itself. Best time is April–October, wider than many high-altitude stops since it sits below the pass's own snow-closure elevation. It functions well as a quieter rest stop for travelers navigating the busy Manali–Rohtang corridor, offering comparable scenery to more congested points along the same road."}, {"id": 45, "name": "Chitkul", "desc": "Chitkul is the last inhabited village before the Indo-Tibetan border, sitting at 3,450m along the Baspa river with wooden temples and apple orchards that mark the end of the accessible road in this direction. Best time is May–October. Its status as a literal endpoint — nowhere further to drive — gives it a specific pull for travelers who want to reach the edge of accessible Himachal, and the Baspa valley scenery on the way in from Sangla is consistently rated among Kinnaur's most striking stretches."}, {"id": 52, "name": "Chicham Bridge", "desc": "Chicham Bridge, at 4,200m, holds the title of Asia's highest bridge, spanning a genuinely dramatic gorge in Spiti that previously required a much longer detour to cross. Best time is June–September. Beyond its engineering significance, the bridge functions as a serious viewpoint in its own right — the drop below is steep enough to be dizzying even for travelers used to high-altitude terrain. It's typically visited en route between Kibber and the rest of the Spiti loop, a functional crossing that's become a destination in itself."}, {"id": 110, "name": "Jispa", "desc": "Jispa is a riverside campsite along the Manali–Leh highway at 3,200m, set on the Bhaga river with Lahaul's peaks rising directly above the campground. Best time is June–September. It's a popular overnight stop for travelers making the multi-day Manali–Leh journey by road, offering a scenic, unhurried break partway through a demanding drive rather than a standalone destination — worth a full rest day rather than just a night if the itinerary allows it."}, {"id": 132, "name": "Beas Kund", "desc": "Beas Kund is the glacial source of the Beas river, sitting at 3,700m and reached via a well-established trek from Solang Valley near Manali. Best time is June–September. The trek is accessible enough for reasonably fit travelers without technical mountaineering experience, making it one of the more approachable glacial-source treks in the region — a solid choice for anyone wanting a genuine high-altitude trekking experience without the multi-day commitment of routes like Sar Pass or Pin Parvati."}, {"id": 41, "name": "Sangla Valley", "desc": "Sangla Valley is widely regarded as one of Kinnaur's most beautiful stretches — the Baspa river running through orchard-lined slopes, with the centuries-old Kamru Fort watching over the valley from a rise above Sangla town. At 2,680m, it's best visited April–June or September–October. It functions as the natural gateway to Chitkul further up the valley, but Sangla holds its own as a destination: fort, orchards, and river views that rival anywhere else in Kinnaur, without requiring the extra drive to the border village beyond."}, {"id": 78, "name": "Palampur", "desc": "Palampur is known as the tea capital of northwest India, its rolling tea gardens set against a striking Dhauladhar mountain backdrop, dotted with Victorian-era bungalows left over from the British tea-planting period. At 1,220m, it's accessible year-round with a best-time window of March–June or September–November. Unlike Kangra's more temple-focused towns, Palampur's identity is agricultural and colonial — tea estate tours and garden walks rather than pilgrimage sites, giving it a genuinely different character from most of the district."}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = DESTINATIONS.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id})</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${DESTINATIONS.length} destinations queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return null;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${DESTINATIONS.length} descriptions.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${DESTINATIONS.length} Descriptions`;
  return session.access_token;
}

let accessToken = null;
checkLogin().then(t => accessToken = t);

async function runAll() {
  if (!accessToken) { accessToken = await checkLogin(); if (!accessToken) return; }
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of DESTINATIONS) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const res = await fetch('/api/dest-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'update',
          id: d.id,
          desc: d.desc,
          access_token: accessToken,
        }),
      });
      const j = await res.json();
      if (res.ok && j.success) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, j.error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${DESTINATIONS.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} descriptions saved successfully! You can now delete this page from your repo.`;
}
</script>
</body>
</html>
