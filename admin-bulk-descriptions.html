<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PahariPath — Bulk Description Upload</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3d2b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7c6e; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(74,124,95,.15);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status.warn { background: #fdf3e3; color: #9b6c1a; }
  .status.ok { background: #e6f4ec; color: #1a6b3c; }
  .status.err { background: #fdeaea; color: #9b2020; }
  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Description Upload</h1>
  <div class="sub">Pushes long-form descriptions into your live Supabase data, using your own admin login. No API keys needed here.</div>

  <div id="statusBox" class="status warn">Checking your login session…</div>

  <div class="card">
    <div id="destList"></div>
    <div class="count" id="countLine"></div>
  </div>

  <button id="runBtn" onclick="runAll()" disabled>Checking login…</button>
</div>

<script>
const SUPABASE_URL = "https://fcrkfemeirmfhhxhomgw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcmtmZW1laXJtZmhoeGhvbWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDE0NjksImV4cCI6MjA5NzM3NzQ2OX0.6OH8shrt0js3E-uh_GHxm2NFASygzTmKeMaNYobclM4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DESTINATIONS = [{"id": 97, "name": "Shillai", "desc": "Shillai has earned a local nickname — Mini Kerala — for a landscape that catches almost every visitor off guard: dense, layered greenery that doesn't match the drier hills typical of Sirmaur district. At 1,400m, it's low-altitude and accessible essentially year-round, though October–April brings the clearest, most comfortable weather. There's no built tourist infrastructure here, no viewpoint with a ticket booth — the appeal is simply driving into a stretch of Himachal that looks nothing like the postcard version. It works well as a detour for travelers already exploring Sirmaur's Renuka Lake or Churdhar circuit who want to see a genuinely different side of the district."}, {"id": 144, "name": "Pin Parvati Pass", "desc": "Pin Parvati Pass is among the most demanding treks in the Indian Himalayas — a multi-day glacier crossing at 5,319m connecting Parvati Valley to Spiti, with no easy exit points once committed. This is strictly for experienced trekkers with proper acclimatization, gear, and ideally a guide; the terrain includes glacier travel and serious altitude exposure. The narrow window is August–September, when the pass is most likely to be clear enough to attempt. What makes it distinct from other high passes is the landscape shift it delivers on foot — lush Parvati forest giving way, over days, to Spiti's stark cold desert. Not a casual add-on to any itinerary; this is the trip."}, {"id": 101, "name": "Bahadurpur Fort", "desc": "Bahadurpur Fort sits on a hilltop above Gobind Sagar Lake in Bilaspur district, reachable by a moderate trek that rewards with a genuine 360-degree view — lake on one side, hills rolling out on the other. At 800m, it's low-altitude and open year-round, though October–March avoids both monsoon slickness and summer heat. The fort itself is more ruin than restoration, which keeps it firmly off the standard tourist circuit despite the payoff at the top. It suits travelers already in Bilaspur for the lake who want to add a half-day hike with a real view rather than just a lakeside stop."}, {"id": 22, "name": "Chehni Kothi", "desc": "Chehni Kothi is one of Himachal's tallest surviving examples of Kath-Kuni architecture — a traditional wood-and-stone tower construction technique roughly 1,500 years old, built without modern fasteners and engineered to withstand earthquakes. At 2,200m in Banjar Valley, it stands largely unchanged and mostly unvisited despite its age and craftsmanship. Best time is April–June or September–November. For travelers who've seen Kath-Kuni style referenced elsewhere in Himachal without seeing a fully intact example, Chehni Kothi is the real thing — worth the detour from Banjar or Jibhi specifically for the architecture."}, {"id": 91, "name": "Dagshai", "desc": "Dagshai is one of India's oldest British-era cantonment towns, and its most striking feature is a 19th-century jail — now a small museum — that once held a range of notable prisoners including, according to local records, participants from the 1857 uprising. At 1,734m in Solan district, it's a compact hill town with a specific, well-preserved slice of colonial history rather than sprawling scenery. Best time is October–March. Unlike Kasauli, which draws a heavier tourist footfall for similar cantonment-town character, Dagshai stays quiet — a solid stop for travelers interested in the colonial military history layered through Himachal's hill stations."}, {"id": 94, "name": "Rajgarh", "desc": "Rajgarh is known locally as the peach bowl of Himachal Pradesh — orchards rather than apple trees define the landscape here, a distinct crop identity from most of the state's fruit country. At 1,400m in Solan district, the town centers on the Thakur Dwar temple and quiet orchard-lined roads, with a best-time window of March–June or September–November. It doesn't have the built-up hill-station infrastructure of Solan or Kasauli nearby, which keeps it firmly local rather than touristy. Worth a visit specifically during peach blossom season in spring, when the orchards are at their most photogenic."}, {"id": 116, "name": "Kinner Kailash Trek", "desc": "The Kinner Kailash trek is a circumambulation — a full circuit — around the sacred Kinner Kailash peak at 6,050m, one of Hinduism's revered mountains, believed by many to be Lord Shiva's winter abode. This is a serious multi-day pilgrimage trek, physically demanding and requiring real fitness and altitude preparation; it's not a casual walk. Best time is July–September. The trek draws primarily devout pilgrims rather than general trekkers, giving it a different character from typical Himachal trekking routes — a genuine spiritual undertaking as much as a physical one, passing close to a peak most travelers only ever view from Kalpa's viewpoints below."}, {"id": 120, "name": "Chanderkhani Pass", "desc": "Chanderkhani Pass connects the controversial, cannabis-associated village of Malana to the quieter town of Naggar via a dramatic high-altitude trek at 3,660m. It sees noticeably less footfall than better-known Kullu-area treks like Hamta Pass or Sar Pass, despite comparably striking alpine scenery along the way. Best time is May–September. The route offers a practical bonus beyond scenery: it's a legitimate way to experience Malana's setting without lingering in the village itself, for travelers who want the landscape without engaging with Malana's more contentious tourist dynamics. Naggar's art and heritage sites make a solid endpoint after the crossing."}, {"id": 121, "name": "Nirmand", "desc": "Nirmand is a heritage village at 1,338m built around ancient temples and traditional Kath-Kuni wood-and-stone architecture, with a specific claim to fame: it's said to have never been conquered by outside rulers throughout its long history, giving the village an unusually intact cultural identity. Best time is October–April. Unlike Kullu's more visited temple towns, Nirmand draws very little tourist traffic despite its historical depth, making it a solid stop for travelers specifically interested in pre-colonial Himachal history and architecture rather than scenery-driven sightseeing."}, {"id": 146, "name": "Vyas Cave", "desc": "Vyas Cave sits near Bilaspur and carries a strong mythological association — local tradition holds that Rishi Vyas, the sage credited with compiling the Mahabharata, meditated here. At just 375m, it's low-altitude and accessible year-round, with October–March being the most comfortable window. The cave itself is modest rather than dramatic, and that's part of its character — a quiet pilgrimage stop rather than a tourist attraction, visited mostly by those with a specific interest in the mythology rather than casual sightseers passing through Bilaspur."}, {"id": 23, "name": "Pulga", "desc": "Pulga sits further up Parvati Valley than most travelers bother to go — past Kasol, past Tosh, into pine forest that thins out the crowds almost completely. At 2,400m, it retains a fairy-tale quality that Kasol lost years ago as tourism scaled up there. Best time is April–June or September–October. The village itself is small, with basic homestays and little in the way of cafes or shops, which is precisely the appeal for travelers who found Kasol and Tosh too commercialized. It rewards those willing to go one stop further than the crowd typically does."}, {"id": 139, "name": "Mamleshwar Temple", "desc": "Mamleshwar Temple is a 10th-century Shiva temple in Karsog Valley, notable for stone carving work that's held up remarkably well across roughly a thousand years. At 1,400m, it's the cultural anchor of the valley — most travelers who make it to Karsog come specifically to see this temple. Best time is March–June or September–November. Its age and craftsmanship put it on par architecturally with better-known Himachal temples, but Karsog's general obscurity as a destination means Mamleshwar sees a fraction of the footfall — worth the trip for anyone with a genuine interest in Himachal's temple architecture."}, {"id": 92, "name": "Bon Monastery", "desc": "The Bon Monastery near Solan represents something genuinely rare in Himachal's spiritual landscape: the Yungdrung Bon tradition, which predates Buddhism in the region and is rarely represented by dedicated monasteries this far from Tibet or the Dolpo region. At 1,800m, it's a quiet, contemplative stop rather than a major pilgrimage site, with a best-time window of October–April. Most visitors to Solan never hear of it, let alone visit — it's a genuine find for travelers interested in comparative Himalayan religious history rather than the more commonly encountered Tibetan Buddhist sites."}, {"id": 98, "name": "Suketi Fossil Park", "desc": "Suketi Fossil Park holds something unexpected for a Himachal destination: genuine Miocene-era fossils, roughly 8 million years old, unearthed from the Shivalik hills nearby, displayed alongside life-size concrete dinosaur models for context. At 600m, it's low-altitude and accessible year-round, with October–March being the most comfortable season. It's one of the only sites of its kind in the state — a paleontology stop rather than a scenic or spiritual one, and a solid option for travelers with kids or anyone curious about Himachal's deep geological history rather than its cultural or natural present."}, {"id": 126, "name": "Indrahar Pass", "desc": "Indrahar Pass is a demanding high-altitude crossing at 4,342m through the Dhauladhar range, connecting Dharamshala to Chamba on foot over several days. It's a serious trek requiring genuine fitness and altitude acclimatization — steep terrain and unpredictable weather even in season. Best time is June–September. Compared to the heavily trafficked Triund trail that shares the same starting range, Indrahar Pass sees only committed trekkers rather than casual day-hikers, since completing the crossing takes real preparation. The reward is a dramatic transition across the Dhauladhar range that few travelers experience firsthand."}, {"id": 34, "name": "GHNP", "desc": "The Great Himalayan National Park is a UNESCO World Heritage Site spanning roughly 1,500 square kilometers of Kullu district, home to snow leopards, over 375 recorded bird species, and ecosystems that have stayed largely undisturbed thanks to trek-only access — no roads penetrate the core zone. Best time is May–June or September–October. Entry typically requires permits and is arranged through Gushaini or Sai Ropa, the main access points. This isn't a quick photo-stop destination; it rewards multi-day treks and serious wildlife or ecology interest, offering a level of untouched wilderness that's genuinely rare even by Himachal's offbeat standards."}, {"id": 38, "name": "Dhankar", "desc": "Dhankar is a village literally built into a cliff face at 3,894m in Spiti, anchored by a centuries-old fort-monastery perched on the edge with dramatic drop-offs on either side. A short trek above the village leads to Dhankar Lake, a small alpine lake that rewards the climb with sweeping valley views. Best time is June–September. The monastery itself holds genuine historical weight as one of Spiti's older religious sites, and the setting — village, fort, and monastery all balanced on a cliff edge — is among the more visually striking single sights in the whole Spiti valley."}, {"id": 39, "name": "Langza", "desc": "Langza sits at 4,400m in Spiti and has a genuinely unusual claim to fame: marine fossils, evidence of an ancient seabed, can still be found lying on the ground around the village — a reminder that this high-altitude desert was once ocean floor. A giant Buddha statue overlooks the settlement from a small rise, visible from a distance across the valley. Best time is June–September. It's typically visited alongside nearby Hikkim and Komic as part of a Spiti loop, but Langza's fossil-hunting angle gives it a distinct draw of its own — genuinely rare geological curiosity layered onto classic Spiti scenery."}, {"id": 47, "name": "Suraj Tal", "desc": "Suraj Tal is one of India's highest lakes, sitting at 4,950m directly on the Manali–Leh highway — the name translates to Lake of the Sun God. Its roadside location makes it more accessible than many high-altitude lakes, though the altitude itself remains a serious consideration; this isn't a stop to linger at without acclimatization. Best time is July–September, matching the highway's open season. For travelers already making the Manali–Leh crossing, it's a natural stop rather than a dedicated destination — but the scale and color of the lake against bare high-altitude terrain make it worth the pause regardless."}, {"id": 65, "name": "Rohru", "desc": "Rohru sits along the Pabbar river in Shimla district and remains one of the least-explored corners of a district otherwise dominated by Shimla town itself. The river is known specifically for trout fishing, drawing a small, dedicated angling crowd rather than general tourists. At 1,525m, it's accessible without acclimatization concerns, with a best-time window of April–June or September–October. There's minimal built tourist infrastructure — this is a river-valley trip built around fishing and quiet riverside time rather than sightseeing, offering a version of Shimla district that most visitors never see."}, {"id": 75, "name": "Kalatop Sanctuary", "desc": "Kalatop Sanctuary sits just 2km from Dalhousie, yet feels like a different world entirely — dense deodar forest, leopard territory, and some of the better birdwatching in Chamba district, all a short drive from a well-known hill station. At 2,400m, it's best visited March–June or September–November. Despite its proximity to Dalhousie's tourist crowds, the sanctuary itself sees comparatively light footfall, since forest walks and wildlife-watching draw a narrower audience than Dalhousie's viewpoints and markets. A solid half-day addition for anyone staying in Dalhousie who wants genuine forest quiet rather than another town square."}, {"id": 93, "name": "Barog", "desc": "Barog is a stop on the UNESCO-listed Kalka–Shimla heritage railway, most famous for Tunnel No. 33 — the longest tunnel on the entire route and the subject of a well-known local legend about the British engineer who built it. At 1,560m, the town itself is small and pleasant, with a best-time window of October–April. Most travelers experience Barog only from the train window as it passes through; stepping off and staying a night gives access to the tunnel and station up close, plus a quieter alternative to Shimla or Solan for anyone tracing the railway's route."}, {"id": 137, "name": "Jagatsukh", "desc": "Jagatsukh was the capital of the Kullu kingdom before the seat moved to Naggar — a fact most visitors to modern Kullu never learn, since the village itself sees very little tourist traffic today. At 1,830m, it holds two ancient Shiva temples with stone carving that reflects its former importance, now visited mainly by locals rather than tourists. Best time is March–June or September–November. For travelers interested in Kullu Valley's pre-Naggar history, Jagatsukh is the place that actually held that history — worth more than the brief stop it typically gets on the way to somewhere else."}, {"id": 142, "name": "Tauni Devi", "desc": "Tauni Devi is a hilltop temple in Hamirpur district offering wide views over the surrounding plains — a genuinely peaceful pilgrimage site that stays quiet even during regional festival periods, unlike some of Himachal's more heavily visited temple complexes. At 700m, it's low-altitude and accessible year-round, with October–March bringing the clearest views. There's no significant tourist infrastructure built up around it — it functions as a local place of worship first, a viewpoint second, which is exactly why it stays uncrowded for travelers who do make the stop."}, {"id": 54, "name": "Kalpa", "desc": "Kalpa faces the Kinner Kailash massif directly, and that view alone accounts for why so many travelers who plan a two-day stop end up staying closer to a week. At 2,960m in Kinnaur, the village sits among apple orchards with traditional Kinnauri architecture still very much in daily use, not preserved for tourists. Best time is April–June or September–October. Compared to Sangla or Chitkul further along the valley, Kalpa offers a similar sense of quiet mountain life with the added draw of one of Kinnaur's most dramatic single views, making it a natural extended-stay base rather than a quick photo stop."}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = DESTINATIONS.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id})</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${DESTINATIONS.length} destinations queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return null;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${DESTINATIONS.length} descriptions.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${DESTINATIONS.length} Descriptions`;
  return session.access_token;
}

let accessToken = null;
checkLogin().then(t => accessToken = t);

async function runAll() {
  if (!accessToken) { accessToken = await checkLogin(); if (!accessToken) return; }
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of DESTINATIONS) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const res = await fetch('/api/dest-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'update',
          id: d.id,
          desc: d.desc,
          access_token: accessToken,
        }),
      });
      const j = await res.json();
      if (res.ok && j.success) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, j.error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${DESTINATIONS.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} descriptions saved successfully! You can now delete this page from your repo.`;
}
</script>
</body>
</html>
