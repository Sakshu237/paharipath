<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PahariPath — Bulk Itinerary Upload</title>
<meta name="robots" content="noindex, nofollow"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3d2b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7c6e; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(74,124,95,.15);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status.warn { background: #fdf3e3; color: #9b6c1a; }
  .status.ok { background: #e6f4ec; color: #1a6b3c; }
  .status.err { background: #fdeaea; color: #9b2020; }
  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Itinerary Upload</h1>
  <div class="sub">Pushes day-by-day itineraries into place_itineraries, using your own admin login.</div>

  <div id="statusBox" class="status warn">Checking your login session…</div>

  <div class="card">
    <div id="destList"></div>
    <div class="count" id="countLine"></div>
  </div>

  <button id="runBtn" onclick="runAll()" disabled>Checking login…</button>
</div>

<script>
const SUPABASE_URL = "https://fcrkfemeirmfhhxhomgw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcmtmZW1laXJtZmhoeGhvbWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDE0NjksImV4cCI6MjA5NzM3NzQ2OX0.6OH8shrt0js3E-uh_GHxm2NFASygzTmKeMaNYobclM4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const ITINERARIES = [{"id": 5, "name": "Pundrik Rishi Lake", "days": [{"title": "Day 1 — Arrival & Sainj Valley", "items": ["Arrive in Sainj Valley and settle into your homestay", "Short acclimatization walk along the river", "Local dinner and early night before the trek"]}, {"title": "Day 2 — Trek to Pundrik Rishi Lake", "items": ["Early start on the trek up to the lake", "Reach the sacred lake by midday, rest and take in the setting", "Return trek and overnight back in the valley"]}, {"title": "Day 3 — Departure", "items": ["Relaxed morning, breakfast with your host", "Optional short walk around Sainj Valley", "Begin your return journey"]}]}, {"id": 135, "name": "Sainj Valley", "days": [{"title": "Day 1 — Arrival in Sainj Valley", "items": ["Arrive and check into a valley homestay", "Evening walk along the river", "Home-cooked Himachali dinner"]}, {"title": "Day 2 — Explore the Valley", "items": ["Morning walk through orchard villages", "Visit Pundrik Rishi Lake if energy allows (trek)", "Evening by the river, stargazing if clear"]}, {"title": "Day 3 — Departure", "items": ["Breakfast with your host family", "Pick up local produce from a village stall", "Return journey"]}]}, {"id": 105, "name": "Kaza", "days": [{"title": "Day 1 — Arrival in Kaza", "items": ["Arrive and acclimatize — Kaza sits above 3,600m, take it slow", "Walk through the market town in the evening", "Early dinner and rest"]}, {"title": "Day 2 — Key Monastery & Kibber", "items": ["Morning visit to Key Monastery", "Continue to Kibber village for high-altitude views", "Return to Kaza for the night"]}, {"title": "Day 3 — Langza, Hikkim & Komic", "items": ["Visit Langza for the Buddha statue and fossils", "Stop at Hikkim, the world's highest post office", "See Komic before returning to Kaza"]}]}, {"id": 48, "name": "Chandratal Lake", "days": [{"title": "Day 1 — Arrival & Camping", "items": ["Arrive at Chandratal by afternoon (permit required)", "Set up camp and walk to the lake for sunset", "Stargazing after dark — skies here are exceptional"]}, {"title": "Day 2 — Lake Circuit & Departure", "items": ["Sunrise at the lake — the crescent shape is clearest early", "Walk the shoreline trail", "Break camp and begin the return drive"]}]}, {"id": 106, "name": "Key Monastery", "days": [{"title": "Day 1 — Arrival in Kaza, Visit Key", "items": ["Arrive in Kaza and acclimatize", "Afternoon visit to Key Monastery, perched on its cliffside", "Evening back in Kaza"]}, {"title": "Day 2 — Monastery Life & Kibber", "items": ["Early morning prayers at Key Monastery if permitted", "Continue on to Kibber village", "Return to Kaza by evening"]}]}, {"id": 21, "name": "Grahan", "days": [{"title": "Day 1 — Trek to Grahan", "items": ["Start the trek from Kasol through dense forest", "Arrive in Grahan by afternoon, settle into a homestay", "Evening in the village — no phone signal, fully disconnect"]}, {"title": "Day 2 — Village Life & Return", "items": ["Morning walk around the village and surrounding forest", "Meals with your host family", "Trek back down to Kasol"]}]}, {"id": 29, "name": "Sethan", "days": [{"title": "Day 1 — Arrival in Sethan", "items": ["Trek or drive up from Manali to Sethan", "Settle into a homestay, walk the village paths", "Evening views over the Kullu valley below"]}, {"title": "Day 2 — Snow Walks & Departure", "items": ["Morning walk through the surrounding snow-line forest", "Photography and quiet village time", "Return journey to Manali"]}]}, {"id": 35, "name": "Barot", "days": [{"title": "Day 1 — Arrival & Trout Fishing", "items": ["Arrive in Barot and settle by the Uhl river", "Visit the trout hatchery, try rod-and-line fishing", "Riverside dinner"]}, {"title": "Day 2 — Forest Walks & Departure", "items": ["Morning forest walk along the river", "Relax by the water or fish again", "Begin your return journey"]}]}, {"id": 1, "name": "Pangi Valley", "days": [{"title": "Day 1 — Arrival via Sach Pass", "items": ["Cross Sach Pass and descend into Pangi Valley (window: Jun-Sep only)", "Settle into a homestay with a local Pangwal family", "Evening in the valley — expect no phone signal"]}, {"title": "Day 2 — Valley Villages", "items": ["Walk through nearby villages along the Chenab river", "Learn about Pangwal culture and daily life from your hosts", "Evening meal with the family"]}, {"title": "Day 3 — Departure", "items": ["Morning walk before leaving", "Begin the return crossing over Sach Pass", "Allow extra time — road conditions can change fast"]}]}, {"id": 2, "name": "Pooh", "days": [{"title": "Day 1 — Arrival in Pooh", "items": ["Arrive in this remote Kinnauri village near the border", "Visit the village's old temples", "Homestay dinner with a local family"]}, {"title": "Day 2 — Village Walks & Departure", "items": ["Morning walk through Pooh and surrounding terrain", "Photography of the dramatic dry-mountain views", "Begin your onward journey"]}]}, {"id": 3, "name": "Rasol", "days": [{"title": "Day 1 — Trek to Rasol", "items": ["Start the trek from Kasol through pine forest", "Arrive in Rasol by afternoon, settle into a homestay", "Quiet evening in the village"]}, {"title": "Day 2 — Return Trek", "items": ["Morning walk around Rasol's forest trails", "Breakfast with your host", "Trek back down to Kasol"]}]}, {"id": 4, "name": "Karsog Valley", "days": [{"title": "Day 1 — Arrival in Karsog Valley", "items": ["Arrive and settle into an orchard-village homestay", "Visit the 10th-century Mamleshwar Mahadev temple", "Evening walk through the orchards"]}, {"title": "Day 2 — Valley Exploration & Departure", "items": ["Morning walk through nearby villages", "Local produce shopping if in season", "Begin your return journey"]}]}, {"id": 6, "name": "Haripurdhar", "days": [{"title": "Day 1 — Arrival in Haripurdhar", "items": ["Drive up to the ridge and settle into a homestay", "Walk through the deodar forest", "Evening views over Renuka Lake below"]}, {"title": "Day 2 — Forest Trails & Departure", "items": ["Morning forest walk", "Optional stop at Renuka Lake on the way out", "Begin your return journey"]}]}, {"id": 7, "name": "Thachi Valley", "days": [{"title": "Day 1 — Arrival in Thachi Valley", "items": ["Drive in through apple-orchard country", "Settle into a homestay with an orchard-owning family", "Evening walk through the village"]}, {"title": "Day 2 — Orchard Life & Departure", "items": ["Morning in the orchards, seasonal work if timing allows", "Village walk and local conversation", "Begin your return journey"]}]}, {"id": 8, "name": "Sach Pass", "days": [{"title": "Day 1 — Cross Sach Pass", "items": ["Early start — this is a demanding high-altitude crossing (Jul-Sep only)", "Navigate the switchbacks carefully, expect snow patches even in July", "Continue on toward Pangi Valley or return, depending on your plan"]}]}, {"id": 9, "name": "Churdhar Peak", "days": [{"title": "Day 1 — Trek Start from Nohradhar/Sarain", "items": ["Begin the climb toward Churdhar Peak", "Gain altitude steadily through forest and ridgeline", "Camp or rest partway up depending on pace"]}, {"title": "Day 2 — Summit & Descent", "items": ["Early climb to the summit and Shirgul Maharaj temple", "Take in the 360-degree views across the outer Himalayas", "Descend back to the trailhead"]}]}, {"id": 10, "name": "Ribba", "days": [{"title": "Day 1 — Arrival in Ribba", "items": ["Arrive in this Kinnauri village known for its vineyards", "Walk through the village and vineyard terraces", "Homestay dinner with local Kinnauri food"]}, {"title": "Day 2 — Vineyard Walks & Departure", "items": ["Morning walk through the grape terraces (best Aug-Oct)", "Learn about local winemaking traditions", "Begin your onward journey"]}]}, {"id": 11, "name": "Kalga", "days": [{"title": "Day 1 — Trek to Kalga", "items": ["Short trek up from the road-end near Barshaini", "Settle into a small family-run homestay", "Quiet evening — forest sounds and birdsong"]}, {"title": "Day 2 — Forest Walks & Departure", "items": ["Morning walk through the surrounding forest", "Slow breakfast, no fixed agenda", "Trek back down when ready"]}]}, {"id": 12, "name": "Bhaba Valley", "days": [{"title": "Day 1 — Arrival in Bhaba Valley", "items": ["Arrive in Kinnaur's greenest valley", "Settle into a homestay near the river", "Evening walk through the meadows"]}, {"title": "Day 2 — Valley Walks & Departure", "items": ["Morning walk further into the valley toward the Bhaba Pass trailhead", "Return to the village for lunch", "Begin your return journey"]}]}, {"id": 13, "name": "Khab", "days": [{"title": "Day 1 — Kinnaur-Spiti Drive Stop", "items": ["Stop at Khab en route between Kinnaur and Spiti", "Take in the dramatic Spiti-Sutlej confluence", "Continue your journey toward Spiti or back into Kinnaur"]}]}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = ITINERARIES.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id}, ${d.days.length}d)</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${ITINERARIES.length} itineraries queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return false;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${ITINERARIES.length} itineraries.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${ITINERARIES.length} Itineraries`;
  return true;
}

checkLogin();

async function runAll() {
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of ITINERARIES) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const { error } = await sb.from('place_itineraries').upsert(
        { place_id: d.id, days: d.days },
        { onConflict: 'place_id' }
      );
      if (!error) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${ITINERARIES.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} itineraries saved successfully! You can now delete this page from your repo.`;
}
</script>
</body>
</html>
