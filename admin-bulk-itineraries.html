<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3d2b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7c6e; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(74,124,95,.15);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status.warn { background: #fdf3e3; color: #9b6c1a; }
  .status.ok { background: #e6f4ec; color: #1a6b3c; }
  .status.err { background: #fdeaea; color: #9b2020; }
  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>
</head>

  <h1>Bulk Itinerary Upload</h1>
  <div class="sub">Pushes day-by-day itineraries into place_itineraries, using your own admin login.</div>

  <div id="statusBox" class="status warn">Checking your login session…</div>

  <div class="card">
    <div id="destList"></div>
    <div class="count" id="countLine"></div>
  </div>

  <button id="runBtn" onclick="runAll()" disabled>Checking login…</button>
</div>

<script>

const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcmtmZW1laXJtZmhoeGhvbWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDE0NjksImV4cCI6MjA5NzM3NzQ2OX0.6OH8shrt0js3E-uh_GHxm2NFASygzTmKeMaNYobclM4";

const ITINERARIES = [{"id": 46, "name": "Prashar Lake", "days": [{"title": "Day 1 — Trek to Prashar Lake", "items": ["Trek up to this high-altitude lake, known for its small floating island", "Visit the distinctive pagoda-style temple on the lakeshore", "Camp near the lake or descend the same day"]}]}, {"id": 49, "name": "Rewalsar Lake", "days": [{"title": "Day 1 — Three-Faith Sacred Lake", "items": ["Arrive at Rewalsar, sacred to Hindus, Buddhists, and Sikhs alike", "Visit the monasteries, temple, and gurudwara clustered around the lake", "Walk the lakeside circuit taking in all three traditions"]}]}, {"id": 56, "name": "Manimahesh Lake", "days": [{"title": "Day 1-2 — Pilgrimage Trek from Bharmour", "items": ["Begin the pilgrimage trek from Bharmour toward the sacred lake", "Join the flow of pilgrims, especially dense during the August-September Yatra", "Camp en route at designated pilgrim stops"]}, {"title": "Day 3 — Lake & Descent", "items": ["Reach Manimahesh Lake, believed to be Lord Shiva's abode", "Take part in the ritual bath if you wish, alongside pilgrims", "Descend back toward Bharmour"]}]}, {"id": 57, "name": "Kheerganga", "days": [{"title": "Day 1 — Trek to Kheerganga", "items": ["Start the roughly 12km trek from Barshaini through Parvati Valley forest", "Arrive at Kheerganga by afternoon and soak in the natural hot springs", "Overnight in a trekker's camp near the springs"]}, {"title": "Day 2 — Descent", "items": ["Morning soak before the crowds arrive", "Begin the trek back down to Barshaini", "Return to Kasol or onward"]}]}, {"id": 59, "name": "Dharamkot", "days": [{"title": "Day 1 — Arrival in Dharamkot", "items": ["Arrive above McLeod Ganj in this quieter yoga-retreat village", "Join a drop-in yoga or meditation session if available", "Evening walk through the forested lanes"]}, {"title": "Day 2 — Forest Walks & Departure", "items": ["Morning walk toward Triund's lower trail sections", "Café time in the village's low-key retreat scene", "Head down  Manali's cafe streets", "Visit the Hadimba Temple in its deodar grove", "Evening in the main market"]}, {"title": "Day 2 — Solang Valley", "items": ["Day trip to Solang Valley for adventure activities or views", "Return to Manali by evening", "Explore Vashisht's hot springs if time allows"]}, {"title": "Day 3 — Rohtang Pass (seasonal) & Departure", "items": ["If in season (May-Oct) and permitted, visit Rohtang Pass", "Otherwise explore Manali's markets further", "Begin your onward journey"]}]}, {"id": 87, "name": "Shimla", "days": [{"title": "Day 1 — Mall Road & Ridge", "items": ["Arrive and walk Mall Road and the Ridge", "Visit Jakhu Temple, reachable by a short walk or ropeway", "Evening on the Ridge as the town lights up"]}, {"title": "Day 2 — Toy Train & Around", "items": ["Take a short segment of the toy train if timing allows", "Explore Christ Church and the colonial-era architecture", "Day trip to Kufri if you want snow/adventure activities"]}]}, {"id": 89, "name": "Kufri", "days": [{"title": "Day 1 — Snow & Views from Kufri", "items": ["Arrive in Kufri, a short trip from Shimla", "In winter (Jan-Feb), try skiing or snow activities", "Take in Himalayan views from the ridge"]}]}, {"id": 90, "name": "Kasauli", "days": [{"title": "Day 1 — Arrival & Monkey Point", "items": ["Arrive in this colonial-era cantonment town", "Walk up to Monkey Point for wide valley views", "Explore the town's old colonial architecture"]}]}, {"id": 95, "name": "Renuka Ji Lake", "days": [{"title": "Day 1 — Largest Lake in HP", "items": ["Arrive at Renuka Ji, Himachal's largest natural lake", "Walk the lakeside path — considered sacred, shaped like a woman's profile in local belief", "Visit the small zoo and temple near the lake"]}]}, {"id": 96, "name": "Paonta Sahib", "days": [{"title": "Day 1 — Historic Gurudwara", "items": ["Visit Paonta Sahib, a historically significant Sikh gurudwara", "Learn about its connection to Guru Gobind Singh's life here", "Walk along the Yamuna riverside n od Ganj to Bhagsu Nag temple", "Continue to the Bhagsu waterfall just above", "Café time in the village before heading back"]}]}, {"id": 117, "name": "Solang Valley", "days": [{"title": "Day 1 — Adventure Activities", "items": ["Arrive in Solang Valley near Manali", "Try paragliding, zorbing, or the cable car depending on season", "In winter (Jan-Feb), enjoy the snow activities on offer"]}]}, {"id": 118, "name": "Rohtang Pass", "days": [{"title": "Day 1 — Crossing Rohtang Pass", "items": ["Arrange permits in advance — access is regulated", "Cross the pass at 3,978m, gateway to Lahaul and Spiti", "Expect snow even in summer months and heavy seasonal traffic"]}]}, {"id": 123, "name": "Bijli Mahadev", "days": [{"title": "Day 1 — Trek to Bijli Mahadev", "items": ["Trek up to this temple, known for its lightning-struck Shiva lingam legend", "Take in wide views over the Kullu Valley from the temple ridge", "Learn the local legend of the lingam's periodic restoration"]}]}, {"id": 134, "name": "Old Manali", "days": [{"title": "Day 1 — Cafes & Manu Temple", "items": ["Walk through Old Manali's cafe-lined lanes", "Visit the Manu Temple, dedicated to the sage believed to have originated here", "Spend an unhurried evening in the area's relaxed atmosphere"]}]}, {"id": 136, "name": "Gulaba", "days": [{"title": "Day 1 — Quieter Snow Point", "items": ["Arrive at Gulaba as a calmer alternative to Rohtang's crowds", "Enjoy snow-season activities without the pass's regulated permit hassle", "Take in views along the same corridor toward Rohtang"]}]}, {"id": 145, "name": "Dharmshala Lower", "days": [{"title": "Day 1 — Local Market Experience", "items": ["Explore the main market of lower Dharamshala", "Get a feel for the everyday, non-touristy side of the town", "Combine with a trip up to McLeod Ganj for the fuller picture"]}]}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = ITINERARIES.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id}, ${d.days.length}d)</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${ITINERARIES.length} itineraries queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return false;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${ITINERARIES.length} itineraries.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${ITINERARIES.length} Itineraries`;
  return true;
}

checkLogin();

async function runAll() {
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of ITINERARIES) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const { error } = await sb.from('place_itineraries').upsert(
        { place_id: d.id, days: d.days },
        { onConflict: 'place_id' }
      );
      if (!error) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${ITINERARIES.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} itineraries saved successfully! You can now delete this page from your repo.`;
}
</script>
