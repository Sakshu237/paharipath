<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3d2b; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7c6e; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid rgba(74,124,95,.15);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status.warn { background: #fdf3e3; color: #9b6c1a; }
  .status.ok { background: #e6f4ec; color: #1a6b3c; }
  .status.err { background: #fdeaea; color: #9b2020; }
  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>
</head>

  <div id="statusBox" class="status warn">Checking your login session…</div>

  <div class="card">
    <div id="destList"></div>
    <div class="count" id="countLine"></div>
  </div>

  <button id="runBtn" onclick="runAll()" disabled>Checking login…</button>
</div>

eturn to Shoja for the night, or begin your onward journey"]}]}, {"id": 97, "name": "Shillai", "days": [{"title": "Day 1 — Arrival in Shillai", "items": ["Arrive in Sirmaur's 'Mini Kerala' — unusually dense greenery for the district", "Drive or walk through the layered green landscape", "Evening in this quiet, undeveloped stretch of Sirmaur"]}]}, {"id": 144, "name": "Pin Parvati Pass", "days": [{"title": "Day 1-2 — Parvati Side Approach", "items": ["Begin the multi-day trek from the Parvati Valley side (proper acclimatization essential)", "Trek through forest and alpine terrain gaining altitude steadily", "Camp at a high-altitude base before the pass crossing"]}, {"title": "Day 3 — The Pass Crossing", "items": ["Cross the glacier at 5,319m — this is the technical crux of the trek", "Descend into the Spiti side of the range", "Camp on the Spiti side, landscape now visibly cold-desert"]}, {"title": "Day 4-5 — Descent into Spiti", "items": ["Continue the descent toward Pin Valley", "Reach the valley floor and a village with road access", "Arrange onward transport from Pin Valley"]}]}, {"id": 101, "name": "Bahadurpur Fort", "days": [{"title": "Day 1 — Trek to Bahadurpur Fort", "items": ["Trek up from near Gobind Sagar Lake to the hilltop fort ruins", "Take in the view — lake on one side, hills on the other", "Descend back toward the lake"]}]}, {"id": 22, "name": "Chehni Kothi", "days": [{"title": "Day 1 — Visit from Banjar/Jibhi", "items": ["Drive or walk to Chehni Kothi in Banjar Valley", "Examine the roughly 1,500-year-old Kath-Kuni tower architecture up close", "Return to Banjar or Jibhi for the night"]}]}, {"id": 91, "name": "Dagshai", "days": [{"title": "Day 1 — Arrival in Dagshai", "items": ["Arrive in this old British-era cantonment town", "Visit the 19th-century jail, now a small museum", "Walk through the quiet cantonment streets"]}, {"title": "Day 2 — Colonial History & Departure", "items": ["Morning revisit of the jail museum if you want more time", "Compare notes with Kasauli's similar cantonment character nearby", "Begin your onward journey"]}]}, {"id": 94, "name": "Rajgarh", "days": [{"title": "Day 1 — Arrival in Rajgarh", "items": ["Arrive in Himachal's peach country", "Visit the Thakur Dwar temple", "Walk through the peach orchards (best in spring blossom season)"]}, {"title": "Day 2 — Orchard Walks & Departure", "items": ["Morning orchard walk", "Local produce shopping if in season", "Begin your return journey"]}]}, {"id": 116, "name": "Kinner Kailash Trek", "days": [{"title": "Day 1-2 — Trek Start", "items": ["Begin the pilgrimage circuit trek around the sacred Kinner Kailash peak", "Gain altitude steadily alongside pilgrim groups", "Camp at designated points along the circuit"]}, {"title": "Day 3 — Circuit Continuation", "items": ["Continue the circumambulation, taking in close views of the 6,050m peak", "Rest at high-altitude camps as needed", "Push toward the circuit's return leg"]}, {"title": "Day 4 — Completion & Descent", "items": ["Complete the circuit back to the trailhead", "Reflect on the pilgrimage — many trekkers describe this as as much spiritual as physical", "Descend to road access"]}]}, {"id": 120, "name": "Chanderkhani Pass", "days": [{"title": "Day 1 — Trek from Naggar", "items": ["Start the trek from Naggar toward Chanderkhani Pass", "Gain altitude through alpine terrain", "Camp near the pass at 3,660m"]}, {"title": "Day 2 — Pass Crossing & Descent", "items": ["Cross the pass with views toward Malana's valley below", "Descend toward Naggar without needing to enter Malana village itself", "Visit Naggar's art and heritage sites on return"]}]}, {"id": 121, "name": "Nirmand", "days": [{"title": "Day 1 — Arrival in Nirmand", "items": ["Arrive in this heritage village, notable for never having been conquered historically", "Visit the ancient temples and Kath-Kuni architecture", "Walk through the old village core"]}]}, {"id": 146, "name": "Vyas Cave", "days": [{"title": "Day 1 — Visit near Bilaspur", "items": ["Visit Vyas Cave, associated with the sage credited with the Mahabharata", "Spend a quiet moment at this modest pilgrimage site", "Continue on to other Bilaspur-area stops like Bahadurpur Fort"]}]}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = ITINERARIES.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id}, ${d.days.length}d)</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${ITINERARIES.length} itineraries queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return false;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${ITINERARIES.length} itineraries.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${ITINERARIES.length} Itineraries`;
  return true;
}

checkLogin();

async function runAll() {
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of ITINERARIES) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const { error } = await sb.from('place_itineraries').upsert(
        { place_id: d.id, days: d.days },
        { onConflict: 'place_id' }
      );
      if (!error) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${ITINERARIES.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} itineraries saved successfully! You can now delete this page from your repo.`;
}
</script>
