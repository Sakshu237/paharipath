  * { box-sizing: border-box; }
  body {

  .card {

    padding: 20px;
    margin-bottom: 16px;

  .status {

  button {
    background: #1a3d2b;
    color: #fff;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .pill.pending { background: #f0f0ee; color: #888; }
  .pill.ok { background: #e6f4ec; color: #1a6b3c; }
  .pill.fail { background: #fdeaea; color: #9b2020; }
  .count { font-size: 13px; color: #6b7c6e; margin-top: 12px; }
</style>

p the valley", "Begin your return journey when ready"]}]}, {"id": 40, "name": "Hikkim", "days": [{"title": "Day 1 — Visit the World's Highest Post Office", "items": ["Arrive in Hikkim at 4,440m", "Send a postcard from the world's highest post office, hand-stamped with the location", "Combine with nearby Komic and Langza on the same day if energy allows"]}]}, {"id": 55, "name": "Bharmour", "days": [{"title": "Day 1 — Arrival & Chaurasi Temple", "items": ["Arrive in Bharmour, home to the Gaddi pastoral community", "Visit the Chaurasi temple complex — 84 shrines clustered together, some over a thousand years old", "Evening among the Gaddi community's daily life"]}, {"title": "Day 2 — Manimahesh Base or Departure", "items": ["Optionally begin the Manimahesh Lake pilgrimage trek from here (June-September)", "Or spend a second day exploring Bharmour's temple architecture further", "Begin your return journey"]}]}, {"id": 61, "name": "Pong Dam Wetlands", "days": [{"title": "Day 1 — Birdwatching at Pong Dam", "items": ["Visit November-February for the migratory season — outside this window, skip it", "Watch for bar-headed geese among the 220+ recorded migratory species", "Bring binoculars; this is one of Himachal's genuine world-class wildlife spectacles"]}]}, {"id": 64, "name": "Sar Pass", "days": [{"title": "Day 1-2 — Trek Start & Snowfields", "items": ["Begin the five-day Sar Pass trek, gaining altitude through forest", "Reach extended snowfield stretches — the trek's signature feature even in late spring", "Camp at high-altitude points en route"]}, {"title": "Day 3 — Pass Crossing", "items": ["Cross Sar Pass at 4,250m", "Take in the snowfield views from the highest point of the trek", "Begin the descent on the far side"]}, {"title": "Day 4-5 — Descent & Return", "items": ["Continue descending through changing terrain", "Reach the trailhead and arrange return transport", "Reflect on a solid intermediate trek — a step up from Jalori Pass, a step below Pin Parvati"]}]}, {"id": 109, "name": "Keylong", "days": [{"title": "Day 1 — Arrival in Keylong", "items": ["Arrive at Lahaul's administrative headquarters — a working town, not a built tourist base", "Visit Shashur Monastery on the rise just above town", "Evening experiencing genuine Lahauli community life"]}]}, {"id": 122, "name": "Katrain", "days": [{"title": "Day 1 — Quiet Stop in Katrain", "items": ["Arrive in this easily overlooked stretch of Kullu Valley", "Walk through the apple orchards along the Beas river", "Slow down — this is a deliberate detour from the Manali-Kullu rush, not a checklist stop"]}]}, {"id": 127, "name": "Mashobra", "days": [{"title": "Day 1 — Arrival in Mashobra", "items": ["Arrive close to Shimla but with a village character Mall Road has lost", "Visit the Craignano picnic spot", "Walk through the surrounding apple orchards"]}]}, {"id": 131, "name": "Nadaun", "days": [{"title": "Day 1 — Visit Nadaun", "items": ["Arrive on the Beas river in Hamirpur district", "Visit the ruins of Raja Sansar Chand's palace", "Walk the peaceful riverfront and visit the active gurudwara"]}]}, {"id": 140, "name": "Sundernagar", "days": [{"title": "Day 1 — Sukh Sagar & Pandoh Dam", "items": ["Stop at Sukh Sagar lake in Sundernagar town", "Continue to the Pandoh Dam viewpoint just outside town", "Use this as a practical waypoint toward Mandi or Kullu"]}]}, {"id": 33, "name": "Jalori Pass", "days": [{"title": "Day 1 — Drive to Jalori Pass", "items": ["Drive up to the pass at 3,120m — road-accessible, no multi-day trek required", "Take in the panoramic Himalayan views right from the road", "Optional short trail walk toward Sereolesar Lake"]}]}, {"id": 36, "name": "Tirthan Valley", "days": [{"title": "Day 1 — Arrival in Tirthan Valley", "items": ["Arrive at the gateway to Great Himalayan National Park", "Settle into a homestay by the crystal-clear Tirthan river", "Evening trout fishing or riverside walk"]}, {"title": "Day 2 — River & Forest Time", "items": ["Morning forest walk toward the GHNP boundary", "Fish again or simply enjoy the valley's deliberate quiet — homestays, not hotels", "Evening by the river"]}]}, {"id": 42, "name": "Lahaul Valley", "days": [{"title": "Day 1 — Entry via Rohtang", "items": ["Cross into Lahaul Valley through Rohtang Pass (June-September window)", "Drive along the Chandrabhaga river corridor", "Visit a scattered Buddhist monastery along the way"]}, {"title": "Day 2 — Wildflowers & Onward", "items": ["Morning walk if visiting in wildflower season", "Continue toward Baralacha La or onward to Spiti/Ladakh", "Compare the valley's greener character to Spiti just over the ridge"]}]}, {"id": 50, "name": "Kibber", "days": [{"title": "Day 1 — Arrival in Kibber", "items": ["Acclimatize properly before heading to Kibber at 4,205m — among the highest motorable villages in the world", "Settle in and ask locals about recent snow leopard activity", "Evening in this genuine high-Himalayan wildlife territory"]}, {"title": "Day 2 — Wildlife Watching & Departure", "items": ["Early morning is best for any wildlife activity — sightings are rare but not impossible", "Walk the terrain around the village with a local guide if available", "Begin your return journey toward Kaza"]}]}, {"id": 60, "name": "Masrur Rock Temple", "days": [{"title": "Day 1 — Visit Masrur Rock Temple", "items": ["Arrive at this 8th-century complex carved directly from a single rock face", "Take time with the architecture — often compared to Maharashtra's Ellora Caves", "Reflect on how under-visited this site is relative to its significance"]}]}, {"id": 69, "name": "Naldhera", "days": [{"title": "Day 1 — Golf History & Nag Temple", "items": ["Visit India's oldest golf course, established in 1905 by Lord Curzon", "Stop at the adjacent Nag temple", "Enjoy Naldhera's quieter, greener alternative to central Shimla"]}]}];

const listEl = document.getElementById('destList');
const countLine = document.getElementById('countLine');
const statusBox = document.getElementById('statusBox');
const runBtn = document.getElementById('runBtn');

function renderList() {
  listEl.innerHTML = ITINERARIES.map(d => `
    <div class="row" id="row-${d.id}">
      <span>${d.name} <span style="color:#999">(ID ${d.id}, ${d.days.length}d)</span></span>
      <span class="pill pending" id="pill-${d.id}">Pending</span>
    </div>
  `).join('');
  countLine.textContent = `${ITINERARIES.length} itineraries queued`;
}
renderList();

async function checkLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    statusBox.className = 'status err';
    statusBox.innerHTML = 'You are not logged in. Open your main PahariPath site in another tab, log in as admin, then reload this page.';
    runBtn.textContent = 'Not logged in';
    return false;
  }
  statusBox.className = 'status ok';
  statusBox.textContent = `Logged in as ${session.user.email}. Ready to push ${ITINERARIES.length} itineraries.`;
  runBtn.disabled = false;
  runBtn.textContent = `Push All ${ITINERARIES.length} Itineraries`;
  return true;
}

checkLogin();

async function runAll() {
  runBtn.disabled = true;
  runBtn.textContent = 'Uploading…';
  let ok = 0, fail = 0;

  for (const d of ITINERARIES) {
    const pill = document.getElementById(`pill-${d.id}`);
    pill.textContent = 'Saving…';
    try {
      const { error } = await sb.from('place_itineraries').upsert(
        { place_id: d.id, days: d.days },
        { onConflict: 'place_id' }
      );
      if (!error) {
        pill.className = 'pill ok';
        pill.textContent = '✓ Saved';
        ok++;
      } else {
        pill.className = 'pill fail';
        pill.textContent = 'Failed';
        fail++;
        console.error(d.name, error);
      }
    } catch (e) {
      pill.className = 'pill fail';
      pill.textContent = 'Error';
      fail++;
      console.error(d.name, e);
    }
    countLine.textContent = `${ok} saved, ${fail} failed, ${ITINERARIES.length - ok - fail} remaining`;
  }

  runBtn.textContent = `Done — ${ok} saved, ${fail} failed`;
  statusBox.className = fail ? 'status warn' : 'status ok';
  statusBox.textContent = fail
    ? `Finished with ${fail} failure(s) — check console (F12) for details, or re-run this page to retry.`
    : `All ${ok} itineraries saved successfully! You can now delete this page from your repo.`;
}
</script>
